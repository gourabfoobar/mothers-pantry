services:
  - type: web
    name: mothers-pantry-bridge
    runtime: python
    plan: free
    buildCommand: python3 -m py_compile Backend/server.py
    startCommand: python3 Backend/server.py
    healthCheckPath: /status
    envVars:
      - key: PANTRY_HOST
        value: 0.0.0.0
      - key: PANTRY_PROVIDER
        value: demo
