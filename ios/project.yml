name: Pantry
options:
  bundleIdPrefix: com.motherspantry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

targets:
  Pantry:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pantry
      - path: Shared
    info:
      path: Pantry/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: "Mother's Pantry uses notifications to ask you to approve uncertain items and to show live delivery updates on the Lock Screen."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motherspantry.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PantryWidgetExtension
        embed: true

  PantryWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PantryWidget
      - path: Shared
    info:
      path: PantryWidget/Info.plist
      properties:
        CFBundleDisplayName: "Pantry Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.motherspantry.app.PantryWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
